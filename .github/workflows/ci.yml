name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # fmt + clippy share one runner: fmt is a no-compile check, so folding it in
  # here costs ~2s and saves a whole runner's checkout + toolchain install. The
  # heavier jobs (test, integration, build) stay separate — they benefit more
  # from parallelism than from a shared checkout, and test's coverage build
  # shares no artifacts with clippy anyway.
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Unit + MiniStack tests share one instrumented job so BOTH count toward
  # coverage. Two `--no-report` passes accumulate profile data that a final
  # `report` merges: the second pass runs the #[ignore]d MiniStack + cold-start
  # tests (crates/aws/tests/ministack.rs, crates/lambda-*/tests/cold_start.rs)
  # against the container on :4566. cargo-llvm-cov instruments the spawned
  # `bootstrap-<mod>` bins too, so the four lambda main.rs composition roots and
  # the ring HTTP client are covered rather than reading as 0%. testkit is
  # dev-only scaffolding, excluded from the denominator. Merging the two former
  # jobs trades some parallelism for an accurate single coverage number and
  # avoids running the ignored tests twice.
  test:
    name: Test + coverage (incl. MiniStack)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: cargo-llvm-cov
      - name: Start MiniStack
        run: docker compose -f docker-compose.test.yml up -d
      - name: Wait for MiniStack (:4566)
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:4566; then
              echo "MiniStack ready"; exit 0
            fi
            echo "waiting for MiniStack ($i)..."; sleep 2
          done
          echo "MiniStack never became ready on :4566"
          docker compose -f docker-compose.test.yml logs
          exit 1
      - name: Unit tests (coverage, no report)
        run: cargo llvm-cov --no-report --workspace --all-features
      - name: MiniStack integration tests (coverage, no report)
        run: cargo llvm-cov --no-report --workspace --all-features -- --ignored
      - name: Merge coverage report
        run: cargo llvm-cov report --summary-only --ignore-filename-regex '/testkit/' | tee coverage.txt
      - name: Stop MiniStack
        if: always()
        run: docker compose -f docker-compose.test.yml down
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Coverage"
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build (${{ matrix.arch }} musl)
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      # Native-arch static-musl build — the release artifact path, no zig. This is
      # where the musl / ring-vs-aws-lc-rs breakage surfaces (see docs/deployment.md).
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Cross-target release build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --workspace --release --target ${{ matrix.target }}

  security:
    name: Security
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache: false
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit
        run: cargo audit
      - name: cargo deny
        run: cargo deny check
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
