# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
# Run: cargo deny check   (or: make deny)

[graph]
all-features = true

[advisories]
# RUSTSEC advisory database checks. Unmaintained/unsound are warnings so a
# transitive dep going unmaintained does not block a release on its own.
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = [
  # Patched in h2 0.4.16; we are on 0.4.19. The remaining 0.3.27 copy is reached
  # only through `aws-smithy-http-client`'s `hyper-014` / `legacy-test-util`
  # features, which `all-features = true` above forces on. No shipped artifact
  # contains it: `cargo tree -e normal --target aarch64-unknown-linux-musl` finds
  # zero h2 0.3 in any of the four Lambdas or the CLI. Drop this the moment the
  # 0.3 line disappears from the graph.
  { id = "RUSTSEC-2026-0258", reason = "only h2 0.3.27 is left, and it is unreachable from every shipped artifact" },
]

[licenses]
version = 2
# Permissive licenses expected across the AWS SDK / tokio / rustls stack.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
]
confidence-threshold = 0.9

[[licenses.exceptions]]
# ring bundles a BoringSSL-derived license blob; standard for the ring crate.
name = "ring"
allow = ["OpenSSL"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal workspace crates are referenced by path without a version req, which
# reads as a wildcard. Exempt path-only deps; external wildcards still denied.
allow-wildcard-paths = true
# Guard the hexagonal boundary at the dependency level: aws-lc-rs must never
# reappear (we standardize on rustls + ring — see crates/aws/src/http_client.rs).
# The zlib *-sys crates are banned for the same reason: a C toolchain in the
# graph breaks the static-musl / ARM64 Lambda cross-build. zlib-rs is pure Rust
# but banned too: these bans pin flate2 to one compressor, since a backend swap
# silently changes output bytes and object size, which the parity oracle can't catch.
deny = [
    { name = "aws-lc-rs" },
    { name = "aws-lc-sys" },
    { name = "openssl-sys" },
    { name = "libz-sys" },
    { name = "libz-ng-sys" },
    { name = "zlib-ng-sys" },
    { name = "cloudflare-zlib-sys" },
    { name = "zlib-rs" },
    # RUSTSEC-2026-0258 is ignored above for the test-only 0.3 copy; this keeps
    # the shipped 0.4 line from ever sliding back below the fix.
    { name = "h2", version = ">=0.4.0, <0.4.16" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
