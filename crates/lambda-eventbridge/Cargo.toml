[package]
name = "cloudtrail-rs-lambda-eventbridge"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true

# AWS Lambda's custom runtime requires the executable be named `bootstrap`.
# Without this, cargo names the binary after the package and GoReleaser's
# `binary: bootstrap` lookup fails.
[[bin]]
name = "bootstrap"
path = "src/main.rs"

# All four lambda crates emit a binary named `bootstrap`, so they share one
# output path and cargo uplifts whichever linked last — which also makes
# `CARGO_BIN_EXE_bootstrap` ambiguous under a workspace-wide `cargo test`.
# This second target builds the same `main.rs` under a unique name purely so
# integration tests can address *this* crate's binary. Release builds pass
# `--bin bootstrap` and never produce it.
[[bin]]
name = "bootstrap-eventbridge"
path = "src/main.rs"

[dependencies]
cloudtrail-rs-core = { path = "../core", features = ["decode-eventbridge"] }
cloudtrail-rs-aws = { path = "../aws" }
anyhow = "1"
aws-config = { version = "1", default-features = false }
lambda_runtime = "1"
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["macros", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
cloudtrail-rs-testkit = { path = "../testkit" }
tokio = { version = "1", features = ["macros", "rt"] }
cloudtrail-rs-core = { path = "../core", features = ["decode-eventbridge", "testing"] }
flate2 = "1"
