[package]
name = "cloudtrail-rs-lambda-s3"
version.workspace = true
edition = "2024"
license.workspace = true
publish.workspace = true

# AWS Lambda's custom runtime requires the *deployed* executable be named
# `bootstrap`. All four lambda crates would otherwise emit a bin literally named
# `bootstrap`, colliding on one `target/.../bootstrap` output path under any
# `--workspace` build and making `CARGO_BIN_EXE_bootstrap` ambiguous in tests.
# Instead each crate builds a uniquely-named bin and it's renamed to `bootstrap`
# at packaging: release.yml installs it as `bootstrap`, and `cargo lambda build`
# emits `target/lambda/<name>/bootstrap`. Tests address it via
# CARGO_BIN_EXE_bootstrap-s3.
[[bin]]
name = "bootstrap-s3"
path = "src/main.rs"

[dependencies]
cloudtrail-rs-core = { path = "../core", features = ["decode-s3"] }
cloudtrail-rs-aws = { path = "../aws" }
anyhow = "1"
aws-config = { version = "1", default-features = false }
lambda_runtime = "1"
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["macros", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
cloudtrail-rs-core = { path = "../core", features = ["testing"] }
cloudtrail-rs-testkit = { path = "../testkit" }
flate2 = "1"
tokio = { version = "1", features = ["macros", "rt"] }
