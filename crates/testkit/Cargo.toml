[package]
name = "cloudtrail-rs-testkit"
version.workspace = true
edition = "2024"
license.workspace = true
publish.workspace = true

# Test-support only: every consumer depends on this from `[dev-dependencies]`,
# so nothing here is linked into a shipped binary. It is a real crate rather
# than a `#[path]`-included module because four separate lambda crates plus the
# `aws` crate share it, and a dev-dependency is the only way to share code
# across crate boundaries without publishing it.

[dependencies]
# `testing` for the CloudTrail corpus re-exported as `testkit::corpus`. The
# corpus lives in `core` because core's own integration tests need it and core
# must not dev-depend on this crate — that would pull the AWS SDK into the
# dependency graph of the one crate whose defining property is not having it.
cloudtrail-rs-core = { path = "../core", features = ["testing"] }
aws-config = { version = "1", default-features = false }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio"] }
aws-sdk-ssm = { version = "1", default-features = false, features = ["rt-tokio"] }
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring"] }
aws-smithy-runtime-api = "1"
aws-smithy-types = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde_json = "1"
